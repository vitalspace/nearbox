[package]
name = "nft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "RunWorld NEP-245 collection: capped catalog mint, serial token ids, metadata"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
