[package]
name = "market"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "RunWorld NEP-245 marketplace: list (escrow), buy, cancel"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-api = "0.8"
near-sandbox = { version = "0.4", features = ["global_install", "generate"] }
serde_json = "1"
testresult = "0.4"
tokio = { version = "1", features = ["full"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
