<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#04070f" />
		<meta
			name="description"
			content="NearBox is a live 3D multiplayer village on NEAR where the economy is the gameplay: five merchant NPCs with their own wallets price real NEP-245 items, players move those prices with every trade, and the chain stays invisible behind Google login."
		/>
		<meta
			name="keywords"
			content="NearBox, NEAR Protocol, NEP-245, multiplayer game, blockchain game, game economy, NPC merchants, Web3 game, SvelteKit, Three.js, Rapier, Auth0, nearbox.lol"
		/>
		<meta name="author" content="NearBox" />
		<meta name="application-name" content="NearBox" />
		<meta
			name="robots"
			content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
		/>
		<meta name="googlebot" content="index, follow" />
		<link rel="canonical" href="https://nearbox.lol/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="NearBox" />
		<meta property="og:title" content="NearBox — The economy is the gameplay" />
		<meta
			property="og:description"
			content="A live 3D multiplayer village on NEAR. Five merchant NPCs with wallets, capped NEP-245 items, an on-chain marketplace, and a player-driven economy. Google login, no wallet popups, no gas prompts."
		/>
		<meta property="og:url" content="https://nearbox.lol/" />
		<meta property="og:image" content="https://nearbox.lol/NearBox.png" />
		<meta property="og:image:alt" content="NearBox logo" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="NearBox — The economy is the gameplay" />
		<meta
			name="twitter:description"
			content="A live 3D multiplayer village on NEAR where merchant NPCs with wallets price real NEP-245 items and players move the market."
		/>
		<meta name="twitter:image" content="https://nearbox.lol/NearBox.png" />

		<title>NearBox — The economy is the gameplay</title>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "VideoGame",
				"name": "NearBox",
				"url": "https://nearbox.lol/",
				"image": "https://nearbox.lol/NearBox.png",
				"description": "A live 3D multiplayer village on NEAR where five merchant NPCs with their own wallets price real NEP-245 items, players move those prices by trading, and the blockchain stays invisible behind Google login.",
				"genre": ["Massively multiplayer online game", "Economy simulation", "Role-playing game"],
				"gamePlatform": ["Web browser (desktop and mobile)"],
				"applicationCategory": "Game",
				"operatingSystem": "Any modern browser",
				"inLanguage": "en",
				"isAccessibleForFree": true,
				"publisher": {
					"@type": "Organization",
					"name": "NearBox",
					"url": "https://nearbox.lol/"
				},
				"sameAs": ["https://github.com/vitalspace/nearbox"]
			}
		</script>
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="preload" as="image" href="./NearBox.png" />
		<style>
			html,
			body {
				min-height: 100%;
				background: #04070f;
			}

			/*
			 * Fondo de transición: el único splash visible es el de Svelte
			 * (`LoadingScreen.svelte`), que muestra el logo y el progreso real
			 * de los assets. Aquí solo mantenemos la paleta para evitar un
			 * flash negro antes de que arranque el bundle.
			 */
			body {
				background:
					radial-gradient(ellipse at 24% 26%, rgba(255, 176, 0, 0.26), transparent 46%),
					radial-gradient(ellipse at 78% 24%, rgba(0, 200, 255, 0.24), transparent 48%),
					radial-gradient(ellipse at 50% 108%, rgba(8, 74, 110, 0.38), transparent 62%),
					linear-gradient(165deg, #071326 0%, #050b16 48%, #02040a 100%);
				background-attachment: fixed;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
